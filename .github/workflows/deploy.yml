name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual dispatch (added 2026-08-06 during the GitHub Actions/Pages
  # major outage): pushes made mid-outage never mint runs, so recovery
  # needs a hand-crank. Also just good hygiene.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # ci-red beacon (added 2026-09-10 after the 9-day silent freeze)

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Added 2026-07-28. Nothing ran the suite before this, which is how a
  # host-dependent failure (jsdom's localStorage differing between Node
  # 22 and 26) could sit undetected until the project moved machines.
  # The matrix is the point: one version proves nothing about the other.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report both versions; "22 passed" alone is not news
      matrix:
        node-version: ['22', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.hash.outputs.bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Set the VITE_API_URL repository variable (Settings → Secrets and
      # variables → Actions → Variables) once the backend is deployed;
      # while unset, the app ships in demo mode.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          cp landing-page.html deploy/index.html
          cp roadmap.html deploy/
          cp philosophy.html deploy/
          cp demo.html deploy/
          cp privacy.html deploy/ 2>/dev/null || true
          cp -r site deploy/
          cp -r app deploy/
          cp public/favicon.svg deploy/ 2>/dev/null || true
          cp og-image.png deploy/ 2>/dev/null || true
          cp favicon-onejob.svg deploy/ 2>/dev/null || true
          cp logo-onejob.svg deploy/ 2>/dev/null || true
          cp one-job.png deploy/ 2>/dev/null || true
          cp one-job.svg deploy/ 2>/dev/null || true
          cp robots.txt deploy/ 2>/dev/null || true
          cp placeholder.svg deploy/ 2>/dev/null || true
          cp CNAME deploy/ 2>/dev/null || true

      - name: Record bundle hash for post-deploy verification
        id: hash
        run: echo "bundle=$(grep -o 'index-[A-Za-z0-9_-]*\.js' deploy/app/index.html | head -1)" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

  deploy:
    # Never deploy from pull_request builds. Exclusion, not push-only:
    # == 'push' silently skipped deploy on workflow_dispatch, making the
    # outage hand-crank a green no-op (discovered 2026-08-06, first use).
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Green here means the LIVE site serves the freshly built bundle —
  # "deploy succeeded" is observed, never assumed (lesson of 2026-07-04,
  # when builds failed silently for a day and nobody's phone updated).
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Confirm live site serves the new bundle
        run: |
          expected="${{ needs.build.outputs.bundle }}"
          if [ -z "$expected" ]; then
            echo "No bundle hash recorded — failing loudly" >&2
            exit 1
          fi
          echo "Expecting live site to serve: $expected"
          for i in $(seq 1 20); do
            live=$(curl -fsSL --max-time 20 https://onejob.co/app/ | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            echo "Attempt $i: live serves ${live:-<fetch failed>}"
            if [ "$live" = "$expected" ]; then
              echo "✓ Live site is current."
              exit 0
            fi
            sleep 15
          done
          echo "Live site never served the expected bundle within 5 minutes" >&2
          exit 1

  # Added 2026-09-10, the morning after launch day surfaced a NINE-DAY
  # silent CI freeze (65 consecutive failures since 08-31; nothing
  # deployed; live site served a stale build all week; found only
  # because launch needed a deploy). Failure emails go to commit
  # authors, and this repo's commits are authored by an agent identity
  # with no inbox — so red runs were absence in a channel nobody reads.
  # This job makes failure land in a channel that IS read (issues show
  # in gh, in Coral's session-start sweep, and in Xian's GH
  # notifications). Chokepoint-attached: it runs from the workflow
  # itself, so it cannot be forgotten separately from the thing it
  # watches.
  ci-red-beacon:
    # needs EVERY job: a beacon that only watches test+build is silent
    # when deploy or verify fails — the same silence-shaped hole again.
    # if: failure() fires when any needed job failed (skipped jobs, e.g.
    # deploy on PRs, don't count as failures).
    if: failure()
    needs: [test, build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the CI-red issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CI red: deploy.yml failing on main"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — commit ${{ github.sha }} (${{ github.event.head_commit.message && 'push' || github.event_name }}). Nothing deploys until this is green. Auto-filed by the workflow; close when fixed."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
